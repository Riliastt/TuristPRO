{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="container">
    <div class="form-card">
        <h1>Вход</h1>
        <form method="post">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label><input type="checkbox" name="remember"> Запомнить меня</label>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Войти</button>
        </form>
        <p style="margin-top: 1rem;">Нет аккаунта? <a href="{{ url_for('auth.register') }}">Зарегистрироваться</a></p>
        <details style="margin-top: 1.25rem; font-size: 0.85rem; color: var(--muted);">
            <summary style="cursor: pointer;">Тестовые аккаунты</summary>
            <p style="margin: 0.5rem 0 0;"><strong>Админ:</strong> admin@turistpro.ru / admin123</p>
            <p style="margin: 0.25rem 0;"><strong>Организатор:</strong> organizer@turistpro.ru / organizer123</p>
            <p style="margin: 0.25rem 0;"><strong>Турист:</strong> tourist@turistpro.ru / tourist123</p>
        </details>
    </div>
</div>
{% endblock %}
