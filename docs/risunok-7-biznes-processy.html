<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рисунок 7 — Диаграмма бизнес-процессов TuristPRO</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7f6;
            padding: 32px;
            color: #1e2a28;
        }
        .caption {
            text-align: center;
            font-size: 14pt;
            font-weight: 600;
            margin-bottom: 24px;
            color: #134d42;
        }
        .diagram {
            max-width: 960px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #d8e3e0;
            border-radius: 12px;
            padding: 28px 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
        .start-end { fill: #134d42; stroke: #134d42; }
        .start-end-text { fill: #fff; font-size: 11px; font-weight: 600; }
        .process { fill: #e8f4f1; stroke: #1a6b5c; stroke-width: 1.5; }
        .process-text { fill: #1e2a28; font-size: 10px; }
        .decision { fill: #fff8e6; stroke: #e8a838; stroke-width: 1.5; }
        .decision-text { fill: #1e2a28; font-size: 9px; }
        .data { fill: #f0ebff; stroke: #7b2cbf; stroke-width: 1.5; }
        .data-text { fill: #1e2a28; font-size: 9px; }
        .arrow { stroke: #1a6b5c; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
        .label { fill: #5c6b68; font-size: 9px; font-style: italic; }
        .lane-title { fill: #134d42; font-size: 12px; font-weight: 700; }
        .lane-bg { fill: #fafcfb; stroke: #d8e3e0; stroke-width: 1; }
        .hint { text-align: center; margin-top: 16px; font-size: 10pt; color: #888; }
        @media print { body { background: #fff; } .diagram { box-shadow: none; } .hint { display: none; } }
    </style>
</head>
<body>
    <p class="caption">Рисунок 7 — Диаграмма бизнес-процессов регистрации, бронирования и оплаты</p>
    <div class="diagram">
        <svg viewBox="0 0 920 720" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                    <polygon points="0 0, 8 3, 0 6" fill="#1a6b5c"/>
                </marker>
            </defs>

            <!-- Lane backgrounds -->
            <rect class="lane-bg" x="10" y="30" width="900" height="200" rx="4"/>
            <rect class="lane-bg" x="10" y="240" width="900" height="280" rx="4"/>
            <rect class="lane-bg" x="10" y="530" width="900" height="170" rx="4"/>

            <text class="lane-title" x="24" y="52">Регистрация и вход</text>
            <text class="lane-title" x="24" y="262">Бронирование и оплата</text>
            <text class="lane-title" x="24" y="552">Отмена</text>

            <!-- Registration flow -->
            <ellipse class="start-end" cx="70" cy="100" rx="42" ry="22"/>
            <text class="start-end-text" x="70" y="104" text-anchor="middle">Старт</text>

            <rect class="process" x="140" y="82" width="100" height="36" rx="4"/>
            <text class="process-text" x="190" y="104" text-anchor="middle">Форма регистрации</text>

            <polygon class="decision" points="290,100 330,82 370,100 330,118"/>
            <text class="decision-text" x="330" y="103" text-anchor="middle">Данные</text>
            <text class="decision-text" x="330" y="114" text-anchor="middle">верны?</text>

            <rect class="data" x="400" y="82" width="110" height="36" rx="4"/>
            <text class="data-text" x="455" y="98" text-anchor="middle">User в БД</text>
            <text class="data-text" x="455" y="110" text-anchor="middle">password_hash</text>

            <rect class="process" x="540" y="82" width="90" height="36" rx="4"/>
            <text class="process-text" x="585" y="104" text-anchor="middle">Страница входа</text>

            <rect class="process" x="660" y="82" width="90" height="36" rx="4"/>
            <text class="process-text" x="705" y="98" text-anchor="middle">login_user</text>
            <text class="process-text" x="705" y="110" text-anchor="middle">сессия</text>

            <rect class="process" x="780" y="82" width="100" height="36" rx="4"/>
            <text class="process-text" x="830" y="98" text-anchor="middle">Кабинет по</text>
            <text class="process-text" x="830" y="110" text-anchor="middle">роли</text>

            <path class="arrow" d="M 112 100 L 140 100"/>
            <path class="arrow" d="M 240 100 L 290 100"/>
            <path class="arrow" d="M 370 100 L 400 100"/>
            <path class="arrow" d="M 510 100 L 540 100"/>
            <path class="arrow" d="M 630 100 L 660 100"/>
            <path class="arrow" d="M 750 100 L 780 100"/>
            <text class="label" x="338" y="78">да</text>
            <text class="label" x="300" y="145">нет → flash-сообщение</text>

            <!-- Booking flow -->
            <rect class="process" x="40" y="300" width="100" height="40" rx="4"/>
            <text class="process-text" x="90" y="316" text-anchor="middle">Каталог /</text>
            <text class="process-text" x="90" y="328" text-anchor="middle">карточка</text>

            <rect class="process" x="170" y="300" width="100" height="40" rx="4"/>
            <text class="process-text" x="220" y="316" text-anchor="middle">Выбор слота</text>
            <text class="process-text" x="220" y="328" text-anchor="middle">расписания</text>

            <polygon class="decision" points="320,320 360,300 400,320 360,340"/>
            <text class="decision-text" x="360" y="320" text-anchor="middle">Места</text>
            <text class="decision-text" x="360" y="331" text-anchor="middle">есть?</text>

            <rect class="process" x="430" y="300" width="110" height="40" rx="4"/>
            <text class="process-text" x="485" y="316" text-anchor="middle">seats_booked</text>
            <text class="process-text" x="485" y="328" text-anchor="middle">+= seats_count</text>

            <rect class="data" x="570" y="300" width="100" height="40" rx="4"/>
            <text class="data-text" x="620" y="316" text-anchor="middle">Booking</text>
            <text class="data-text" x="620" y="328" text-anchor="middle">status=pending</text>

            <rect class="data" x="700" y="300" width="90" height="40" rx="4"/>
            <text class="data-text" x="745" y="316" text-anchor="middle">Payment</text>
            <text class="data-text" x="745" y="328" text-anchor="middle">pending</text>

            <rect class="process" x="820" y="300" width="80" height="40" rx="4"/>
            <text class="process-text" x="860" y="316" text-anchor="middle">Форма</text>
            <text class="process-text" x="860" y="328" text-anchor="middle">оплаты</text>

            <path class="arrow" d="M 140 320 L 170 320"/>
            <path class="arrow" d="M 270 320 L 320 320"/>
            <path class="arrow" d="M 400 320 L 430 320"/>
            <path class="arrow" d="M 540 320 L 570 320"/>
            <path class="arrow" d="M 670 320 L 700 320"/>
            <path class="arrow" d="M 790 320 L 820 320"/>
            <text class="label" x="368" y="292">да</text>
            <text class="label" x="318" y="365">нет → отказ</text>

            <!-- Payment -->
            <polygon class="decision" points="360,420 400,400 440,420 400,440"/>
            <text class="decision-text" x="400" y="420" text-anchor="middle">Карта</text>
            <text class="decision-text" x="400" y="431" text-anchor="middle">OK?</text>

            <rect class="data" x="480" y="402" width="120" height="36" rx="4"/>
            <text class="data-text" x="540" y="416" text-anchor="middle">Booking=paid</text>
            <text class="data-text" x="540" y="428" text-anchor="middle">Payment=success</text>

            <rect class="process" x="640" y="402" width="120" height="36" rx="4"/>
            <text class="process-text" x="700" y="416" text-anchor="middle">Личный кабинет</text>
            <text class="process-text" x="700" y="428" text-anchor="middle">туриста</text>

            <path class="arrow" d="M 860 340 L 860 380 L 400 380 L 400 400"/>
            <path class="arrow" d="M 440 420 L 480 420"/>
            <path class="arrow" d="M 600 420 L 640 420"/>
            <text class="label" x="408" y="392">да</text>
            <text class="label" x="350" y="465">нет → повтор ввода</text>

            <!-- Cancel -->
            <rect class="process" x="120" y="580" width="120" height="36" rx="4"/>
            <text class="process-text" x="180" y="596" text-anchor="middle">Запрос отмены</text>
            <text class="process-text" x="180" y="608" text-anchor="middle">(POST cancel)</text>

            <rect class="process" x="280" y="580" width="130" height="36" rx="4"/>
            <text class="process-text" x="345" y="596" text-anchor="middle">seats_booked</text>
            <text class="process-text" x="345" y="608" text-anchor="middle">-= seats_count</text>

            <rect class="data" x="450" y="580" width="120" height="36" rx="4"/>
            <text class="data-text" x="510" y="596" text-anchor="middle">status=</text>
            <text class="data-text" x="510" y="608" text-anchor="middle">cancelled</text>

            <ellipse class="start-end" cx="650" cy="598" rx="50" ry="22"/>
            <text class="start-end-text" x="650" y="602" text-anchor="middle">Места возвращены</text>

            <path class="arrow" d="M 240 598 L 280 598"/>
            <path class="arrow" d="M 410 598 L 450 598"/>
            <path class="arrow" d="M 570 598 L 600 598"/>

            <!-- Vertical connector from payment to cancel option -->
            <path class="arrow" d="M 700 438 L 700 520 L 180 520 L 180 580" stroke-dasharray="4,3"/>
            <text class="label" x="710" y="510">альтернатива: отмена до/после оплаты</text>
        </svg>
    </div>
    <p class="hint">docs/risunok-7-biznes-processy.html — скриншот для диплома</p>
</body>
</html>
